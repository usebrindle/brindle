thresholds:
  low: 30
  medium: 60

# Logical services for service_criticality (ADR 0009): repo-relative globs only.
services:
  github_action_extension:
    globs:
      - "extensions/github-action/**"
  merge_risk_schema:
    globs:
      - "schema/**"

# Optional declarative rule for CI: add label merge-risk-dogfood-declarative on a test PR to verify breakdown (low weight).
declarative_rules:
  dogfood_declarative_label:
    weight: 2
    options:
      labels_any:
        - merge-risk-dogfood-declarative
      score: 18

# Optional trusted plugin (ADR 0001): YAML on base branch only; add label merge-risk-dogfood-trusted-plugin on a test PR to verify.
trusted_plugins:
  directory: ".merge-risk-plugins"
  paths:
    - ".merge-risk-plugins/dogfood-labels.yaml"

criteria:
  diff_size:
    weight: 54
    options:
      # Line churn vs cap → raw score; calibrate so typical PRs map to tiers by repo norms (not tiny caps).
      max_lines_for_cap: 800
  file_patterns:
    weight: 22
    options:
      aggregation: max
      patterns:
        # Bundled Action output: large generated diff; nudge risk when it changes.
        - glob: "**/extensions/github-action/dist/**"
          score: 35
        # Merge-risk schema affects all consumers of .merge-risk.yml
        - glob: "schema/**"
          score: 25
  author_seniority:
    weight: 10
    options:
      aggregation: max
      # Human PRs not listed below get a small baseline signal; automation accounts are explicit.
      default_score: 12
      rules:
        - login: "dependabot[bot]"
          score: 28
        - login: "github-actions[bot]"
          score: 22
  branch_age:
    weight: 8
    options:
      # Head commit age (adapter timestamps); gentle cap so only very stale tips move the needle.
      max_age_hours_for_cap: 336
  service_criticality:
    weight: 6
    options:
      aggregation: max
      default_score: 0
      scores:
        github_action_extension: 32
        merge_risk_schema: 28

# Multiplicative bump for the same automation logins listed under author_seniority (exercises mutators on bot PRs).
mutators:
  junior_author:
    options:
      logins:
        - "dependabot[bot]"
        - "github-actions[bot]"
      multiplier: 1.06
  critical_service:
    options:
      service_ids:
        - merge_risk_schema
        - github_action_extension
      multiplier: 1.05

# Optional native auto-merge (ADR 0002). Requires workflow `contents: write` and repo auto-merge enabled.
auto_merge:
  enabled: true
  tier: low
  method: squash
