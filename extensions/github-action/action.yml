name: Brindle merge risk
description: >
  Score a pull request from base-branch .merge-risk.yml (ADR 0001), then publish a Check Run
  and optional PR comment via the GitHub adapter.
branding:
  icon: shield
  color: gray-dark

inputs:
  github_token:
    description: >
      Token with contents:read (for config on the base ref), checks:write, and pull-requests:write
      as required by your workflow permissions.
    required: false
    default: ${{ github.token }}
  merge_risk_file_path:
    description: Path to the merge-risk YAML file in the repository (read from the pull request base ref).
    required: false
    default: .merge-risk.yml
  skip_when_merge_risk_missing_on_base:
    description: >
      When true, exit successfully if merge_risk_file_path returns 404 on the base ref (e.g. the PR that
      introduces .merge-risk.yml before it exists on main). Never reads config from the PR head (ADR 0001).
    required: false
    default: "false"
  coverage_report_path:
    description: >
      Repository-root-relative path to an Istanbul-style coverage-final JSON file on the pull request head ref
      (e.g. coverage/coverage-final.json). When set and criteria.test_coverage is enabled in .merge-risk.yml,
      the action fetches and parses this file only then (ADR 0005). Leave empty to skip the Contents API call.
    required: false
    default: ""
  informational_check_conclusion:
    description: >
      When true (default), the published Check Run always uses conclusion success so the job and required checks
      stay green; MEDIUM/HIGH still appear in the check body and PR comment. Set false for ADR 0003 semantics
      (neutral for MEDIUM; HIGH is action_required unless fail_on_high is true).
    required: false
    default: "true"
  fail_on_high:
    description: >
      When true and informational_check_conclusion is false, HIGH maps to check conclusion failure instead of
      action_required (ADR 0003). Ignored when informational_check_conclusion is true.
    required: false
    default: "false"
  post_risk_summary_comment:
    description: >
      When true (default), posts merge-risk summary markdown as a pull request comment in addition to the Check Run.
      Set false to publish only the Check Run (still uses pull-requests:write for the check; comment API is skipped).
    required: false
    default: "true"

outputs:
  risk_tier:
    description: Merge-risk tier after scoring (LOW, MEDIUM, or HIGH).
  risk_score:
    description: Numeric aggregate score from 0 through 100 after mutators.
  criteria_breakdown:
    description: JSON string of the per-criterion breakdown array (same shape as ScoreResult.breakdown).
  auto_merge_outcome:
    description: >
      Auto-merge path outcome (skipped, not_eligible, eligible, enabled, unsupported, setting_off).
      See docs/designs/lld-merge-risk-classifier.md and ADR 0002.

runs:
  using: node20
  main: dist/index.js
