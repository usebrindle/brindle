# SonarCloud (https://sonarcloud.io) — align keys with your SonarCloud project onboarding.
# If you import this GitHub repo in SonarCloud, the wizard usually suggests these values.

sonar.organization=usebrindle
sonar.projectKey=usebrindle_brindle
sonar.projectName=Brindle

sonar.sourceEncoding=UTF-8

sonar.sources=core,adapters
sonar.tests=test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**

sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
