name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build merge-risk-core (required for public API + tarball smoke)
        run: npm run build:merge-risk-core

      - name: Test
        run: npm run test -- --coverage

      - name: Verify merge-risk-core pack (dry-run)
        run: npm pack -w @usebrindle/merge-risk-core --dry-run

      - name: Smoke test merge-risk-core tarball install
        run: node scripts/smoke-merge-risk-core-tarball.mjs

      - name: Verify GitHub Action bundle (ncc drift)
        run: npm run build:github-action && git diff --exit-code extensions/github-action/dist
