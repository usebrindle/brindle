name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --coverage

      - name: Build and pack merge-risk-core workspace package
        run: npm run build:merge-risk-core && npm pack -w @usebrindle/merge-risk-core --dry-run

      - name: Verify GitHub Action bundle (ncc drift)
        run: npm run build:github-action && git diff --exit-code extensions/github-action/dist
