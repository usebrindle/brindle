name: Merge risk

on:
  pull_request:

jobs:
  brindle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Brindle merge risk
        uses: ./extensions/github-action
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
