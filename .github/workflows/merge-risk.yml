name: Merge risk

on:
  pull_request:

jobs:
  brindle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      issues: write # list/update PR conversation comments (Issues comments API)
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Brindle merge risk
        uses: ./extensions/github-action
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_when_merge_risk_missing_on_base: true
          informational_check_conclusion: true
