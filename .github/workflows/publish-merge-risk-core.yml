# Publishes @usebrindle/merge-risk-core when a version tag is pushed.
#
# Convention: bump `version` in packages/merge-risk-core/package.json on main first,
# then create and push tag `merge-risk-core-v{version}` (example: merge-risk-core-v0.2.0).
#
# Publishing uses npm Trusted Publishing (OIDC) from GitHub Actions — no long-lived
# NPM_TOKEN. Requires npm CLI ≥ 11.5.1 and Node ≥ 22.14 (see npm docs).
#
# One-time (maintainers): on npmjs.com → @usebrindle/merge-risk-core → Settings →
# Trusted publisher → GitHub Actions. Repository: usebrindle/brindle. Workflow filename
# must match exactly: publish-merge-risk-core.yml

name: Publish merge-risk-core

on:
  push:
    tags:
      - "merge-risk-core-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Use npm CLI with trusted publishing (OIDC)
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm ci

      - name: Build workspace package
        run: npm run build:merge-risk-core

      - name: Publish to npm
        run: npm publish -w @usebrindle/merge-risk-core --access public
