# Validates npm publish metadata for @usebrindle/merge-risk-core when the package changes.
# Full CI already builds, packs (dry-run), and tarball-smokes on every PR; this runs `npm publish --dry-run`
# for parity with the registry publish step (files, ignore rules).

name: merge-risk-core publish dry-run

on:
  pull_request:
    paths:
      - "packages/merge-risk-core/**"
      - ".github/workflows/merge-risk-core-publish-dry-run.yml"

permissions:
  contents: read

jobs:
  npm-publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Build merge-risk-core
        run: npm run build:merge-risk-core

      - name: npm publish dry-run (merge-risk-core)
        run: npm publish -w @usebrindle/merge-risk-core --access public --dry-run
