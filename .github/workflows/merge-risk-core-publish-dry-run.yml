# Extra check when merge-risk-core changes: pack the workspace package with `npm pack --dry-run`
# (same as main CI). Intentionally not `npm publish --dry-run` — that contacts the registry and
# fails whenever package.json version is already published, which is normal on main after a release.

name: merge-risk-core publish dry-run

on:
  pull_request:
    paths:
      - "packages/merge-risk-core/**"

permissions:
  contents: read

jobs:
  npm-publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build merge-risk-core
        run: npm run build:merge-risk-core

      - name: Verify merge-risk-core pack (dry-run)
        run: npm pack -w @usebrindle/merge-risk-core --dry-run
